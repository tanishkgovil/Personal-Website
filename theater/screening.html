<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#140d0d" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Tanishk Govil’s theater." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="theater.css" />
    <title>The theater — Tanishk Govil</title>
  </head>
  <body>
    <a class="skip-link" href="#screen">Skip to screen</a>
    <div class="room" aria-hidden="true">
      <div class="ceiling"></div>
      <div class="wall wall-left"></div><div class="wall wall-right"></div>
      <div class="sconce sconce-left"></div><div class="sconce sconce-right"></div>
      <div class="screen-spill"></div><div class="floor"></div>
    </div>
    <header class="house-header">
      <a class="theater-return" id="return-theater" href="./" aria-label="Return to theater"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6" /></svg><span>Return to theater</span></a>
      <div class="house-actions"><button class="icon-button" id="sound" type="button" aria-label="Mute sound" aria-pressed="true" title="Mute sound (M)" hidden></button><button class="icon-button" id="open-program" type="button" aria-label="Screenings" title="Screenings (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button></div>
    </header>
    <main class="auditorium">
      <div class="screen-surround">
        <section class="screen" id="screen" tabindex="-1" aria-label="Movie screen" aria-busy="true">
          <div id="scene" class="scene"></div>
          <span class="page-count" id="page-count" hidden></span>
          <div class="projection-dimmer" aria-hidden="true"></div>
          <div class="curtains" id="curtains" aria-hidden="true"><div class="curtain curtain-left"></div><div class="curtain curtain-right"></div></div>
          <noscript><div class="screen-message"><h1>The theater</h1><p>Enable JavaScript to watch a screening.</p><a href="../">tanishk.org</a></div></noscript>
        </section>
      </div>
      <nav class="screen-controls" aria-label="Screening controls">
        <button class="icon-button" id="previous" type="button" aria-label="Previous scene" title="Previous (←)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
        <div class="scene-progress" id="scene-progress" role="group" aria-label="Scenes"></div>
        <button class="icon-button" id="next" type="button" aria-label="Next scene" title="Next (→)" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        <button class="icon-button expand-button" id="expand" type="button" aria-label="Expand screen" aria-pressed="false" title="Expand screen (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
      </nav>
      <p class="sr-only" id="scene-announcement" aria-live="polite" aria-atomic="true"></p>
    </main>
    <div class="audience" aria-hidden="true"><div class="seat-row seat-row-back"></div><div class="seat-row seat-row-middle"></div><div class="seat-row seat-row-front"></div></div>
    <dialog class="program-dialog" id="program-dialog" aria-labelledby="program-title">
      <div class="program-header"><h2 id="program-title">Screenings</h2><button class="icon-button close-button" id="close-program" type="button" aria-label="Close screenings" title="Close (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <div class="program-grid" id="program-grid"></div>
      <nav class="program-pagination" id="program-pagination" aria-label="More screenings" hidden><button class="icon-button" id="program-previous" type="button" aria-label="Previous screenings">←</button><span id="program-page"></span><button class="icon-button" id="program-next" type="button" aria-label="Next screenings">→</button></nav>
    </dialog>
    <script type="module" src="theater.js"></script>
  </body>
</html>
